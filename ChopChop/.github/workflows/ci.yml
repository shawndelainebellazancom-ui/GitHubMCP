name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Supply via repo/org secrets (recommended)
      TELERIK_LICENSE: ${{ secrets.TELERIK_LICENSE }}
      TELERIK_NUGET_SOURCE: ${{ secrets.TELERIK_NUGET_SOURCE }}
      TELERIK_NUGET_USERNAME: ${{ secrets.TELERIK_NUGET_USERNAME }}
      TELERIK_NUGET_TOKEN: ${{ secrets.TELERIK_NUGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Telerik NuGet (if credentials provided)
        if: env.TELERIK_NUGET_USERNAME != '' && env.TELERIK_NUGET_TOKEN != ''
        run: |
          dotnet nuget add source "${{ env.TELERIK_NUGET_SOURCE || 'https://nuget.telerik.com/v3/index.json' }}" \
            --name telerik.com \
            --username "${{ env.TELERIK_NUGET_USERNAME }}" \
            --password "${{ env.TELERIK_NUGET_TOKEN }}" \
            --store-password-in-clear-text

      - name: Restore
        working-directory: ChopChop
        run: dotnet restore ChopChop.csproj

      - name: Build Release
        working-directory: ChopChop
        env:
          # Ensure Telerik enabled and license available during build
          USE_TELERIK: 'true'
        run: dotnet build ChopChop.csproj -c Release --nologo

      - name: Publish
        working-directory: ChopChop
        run: dotnet publish ChopChop.csproj -c Release -o publish --nologo

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ChopChop/bin/Release/net8.0/wwwroot
