<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — ChopChop</title>
  <link rel="stylesheet" href="/css/brand.css" />
  <style>body{display:grid;place-items:center;min-height:100vh}</style>
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="theme-color" content="#1E6F4F" />
  <meta name="description" content="You're offline. We'll get you back to your yard in a moment." />
</head>
<body>
  <main class="cc-section">
    <div class="card cc-card" style="padding:20px; max-width:560px; margin:0 auto;">
      <h1>You're offline</h1>
      <p class="cc-helper">It looks like your connection dropped. Try again when you're back online.</p>
      <p class="cc-subtle">Tip: Add the app to your home screen for quick access, even offline.</p>
      <p><a class="cc-link custom-focus" href="/">Return home</a></p>
    </div>
  </main>
  <script>document.addEventListener('click',e=>{if(e.target.closest('a')){if(!navigator.onLine){e.preventDefault();location.href='/';}}});</script>
  </body>
</html>
