name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'ChopChop/**'
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TELERIK_LICENSE: ${{ secrets.TELERIK_LICENSE }}
      TELERIK_NUGET_SOURCE: ${{ secrets.TELERIK_NUGET_SOURCE }}
      TELERIK_NUGET_USERNAME: ${{ secrets.TELERIK_NUGET_USERNAME }}
      TELERIK_NUGET_TOKEN: ${{ secrets.TELERIK_NUGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Warn if Telerik secrets missing
        shell: pwsh
        run: |
          if (-not $env:TELERIK_NUGET_USERNAME -or -not $env:TELERIK_NUGET_TOKEN) {
            Write-Host 'Warning: TELERIK_* secrets not set. If your Telerik feed requires auth, restore will fail.' -ForegroundColor Yellow
          }

      - name: Configure Telerik NuGet
        if: env.TELERIK_NUGET_USERNAME != '' && env.TELERIK_NUGET_TOKEN != ''
        shell: pwsh
        run: |
          dotnet nuget remove source TelerikNuGetV3 -v q || $true
          $source = if ($env:TELERIK_NUGET_SOURCE) { $env:TELERIK_NUGET_SOURCE } else { 'https://nuget.telerik.com/v3/index.json' }
          dotnet nuget add source $source `
            --name TelerikNuGetV3 `
            --username "${env:TELERIK_NUGET_USERNAME}" `
            --password "${env:TELERIK_NUGET_TOKEN}" `
            --store-password-in-clear-text

      - name: Publish site
        working-directory: ChopChop
        shell: pwsh
        run: |
          dotnet publish ChopChop.csproj -c Release --nologo

      - name: Prepare site folder (published wwwroot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $site = Join-Path $env:GITHUB_WORKSPACE 'site'
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          # Find the first publish folder like ChopChop/bin/Release/<tfm>/publish
          $pub = Get-ChildItem -Path 'ChopChop\bin\Release' -Directory -Recurse | Where-Object { $_.Name -eq 'publish' } | Select-Object -First 1
          if (-not $pub) { Write-Error 'Publish folder not found under ChopChop\bin\Release' }
          $src = Join-Path $pub.FullName 'wwwroot'
          if (-not (Test-Path $src)) { Write-Error "Published wwwroot not found at $src" }
          Copy-Item -Path (Join-Path $src '*') -Destination $site -Recurse

      - name: Upload published wwwroot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: chopchop-site
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
    steps:
      - name: Fail if required secrets are missing
        run: |
          missing=()
          [[ -z "${CLOUDFLARE_API_TOKEN}" ]] && missing+=(CLOUDFLARE_API_TOKEN)
          [[ -z "${CF_ACCOUNT_ID}" ]] && missing+=(CF_ACCOUNT_ID)
          [[ -z "${CF_PAGES_PROJECT}" ]] && missing+=(CF_PAGES_PROJECT)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: chopchop-site
          path: site

      - name: Deploy with Wrangler (Cloudflare CLI)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy . --project-name ${{ secrets.CF_PAGES_PROJECT }} --branch ${{ github.ref_name }}

      # Using custom domain for smoke test; ensure your Pages project has tooensure.com bound
      - name: Smoke test (custom domain tooensure.com)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="https://tooensure.com"
          echo "Testing BASE=$BASE"
          endpoints=(
            "/"
            "/index.html"
            "/_framework/blazor.boot.json"
            "/_framework/blazor.webassembly.js"
            "/service-worker.js"
            "/_content/Telerik.UI.for.Blazor/js/telerik-blazor.js?v=2025-08-19-01"
          )
          for p in "${endpoints[@]}"; do
            echo "==> $BASE$p"
            curl -sS -o /dev/null -D - -X HEAD "$BASE$p" || curl -sS -o /dev/null -D - "$BASE$p"
            echo
          done
          echo "- Checking index markers -"
          html="$(curl -sS "$BASE/")"
          if echo "$html" | grep -qE 'v2025-08-19-01|ASSET_STAMP'; then echo "cache-bust stamp present: yes"; else echo "cache-bust stamp present: no"; fi
          if echo "$html" | grep -q '_content/Telerik.UI.for.Blazor/js/telerik-blazor.js'; then echo "telerik js referenced: yes"; else echo "telerik js referenced: no"; fi

      - name: Smoke test (custom domain tooensure.com)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="https://tooensure.com"
          echo "Testing BASE=$BASE"
          endpoints=(
            "/"
            "/index.html"
            "/_framework/blazor.boot.json"
            "/_framework/blazor.webassembly.js"
            "/service-worker.js"
            "/_content/Telerik.UI.for.Blazor/js/telerik-blazor.js?v=2025-08-19-01"
          )
          for p in "${endpoints[@]}"; do
            echo "==> $BASE$p"
            curl -sS -o /dev/null -D - -X HEAD "$BASE$p" || curl -sS -o /dev/null -D - "$BASE$p"
            echo
          done
          echo "- Checking index markers -"
          html="$(curl -sS "$BASE/")"
          if echo "$html" | grep -qE 'v2025-08-19-01|ASSET_STAMP'; then echo "cache-bust stamp present: yes"; else echo "cache-bust stamp present: no"; fi
          if echo "$html" | grep -q '_content/Telerik.UI.for.Blazor/js/telerik-blazor.js'; then echo "telerik js referenced: yes"; else echo "telerik js referenced: no"; fi
